<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CruiseWatch</title>
<style>
:root {
  --bg:#f7f7f5; --card:#ffffff; --fg:#1c1c1a; --muted:#6a6a64; --faint:#9a9a93; --line:#e5e4df; --hover:#f1f1ee;
  --down:#127a47; --down-bg:#e3f3ea; --up:#b42330; --up-bg:#fbe7e8; --accent:#2457c5;
  --c-INTERIOR:#7a52c7; --c-OUTSIDE:#2f6fd6; --c-BALCONY:#d9782b; --c-DELUXE:#1f9e8f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#141413; --card:#1c1c1a; --fg:#ecebe6; --muted:#a3a39b; --faint:#75756e; --line:#2f2f2c; --hover:#252523;
  --down:#4cc38a; --down-bg:#183527; --up:#f0717a; --up-bg:#3d1c1f; --accent:#7aa5f5;
  --c-INTERIOR:#a98ae6; --c-OUTSIDE:#6ea0f0; --c-BALCONY:#f0a35c; --c-DELUXE:#4fc7b8;
  color-scheme: dark;
} }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
main { max-width:1120px; margin:0 auto; padding:20px 16px 64px; }
h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
h2 { font-size:16px; margin:0; }
.muted { color:var(--muted); } .faint { color:var(--faint); }
.down { color:var(--down); } .up { color:var(--up); }
a { color:var(--accent); }
button, select, input { font:inherit; color:var(--fg); }
button { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
button:hover { background:var(--hover); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.link { border:none; background:none; color:var(--accent); padding:0; }
select, input[type=date], input[type=number] { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
.card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }

header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
#status { margin:4px 0 0; font-size:13px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.chip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:13px; }

.filters { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px);
  display:flex; gap:10px 16px; flex-wrap:wrap; align-items:center; padding:10px 0; margin-top:12px; border-bottom:1px solid var(--line); font-size:13px; }
.filters label { display:flex; gap:6px; align-items:center; color:var(--muted); }
.cabin-toggle { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer; background:var(--card); color:var(--fg); user-select:none; }
.cabin-toggle input { display:none; }
.cabin-toggle i { width:9px; height:9px; border-radius:50%; display:inline-block; }
.cabin-toggle:not(.on) { opacity:.45; }

.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { border:none; border-radius:0; padding:5px 10px; font-size:13px; }
.seg button + button { border-left:1px solid var(--line); }
.seg button.on { background:var(--fg); color:var(--bg); }

.summary { font-size:14px; margin:0 0 10px; }
.changes { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.change { display:grid; grid-template-columns:96px 1fr auto 70px; gap:12px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
.change:hover { background:var(--hover); }
.badge { font-weight:700; font-size:13px; border-radius:6px; padding:3px 6px; text-align:center; font-variant-numeric:tabular-nums; }
.badge.down { background:var(--down-bg); } .badge.up { background:var(--up-bg); }
.change .what { min-width:0; }
.change .what b { display:block; font-size:14px; }
.change .what span { font-size:12px; color:var(--muted); }
.change .prices { font-variant-numeric:tabular-nums; white-space:nowrap; font-size:14px; }
.change .prices s { color:var(--faint); margin-right:4px; }
.tag-low { font-size:11px; color:var(--down); border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:6px; white-space:nowrap; }

.chart { position:relative; }
.chart svg { display:block; overflow:visible; }
.chart text { fill:var(--faint); font-size:11px; font-variant-numeric:tabular-nums; }
.tip { position:absolute; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px;
  box-shadow:0 4px 16px rgba(0,0,0,.12); white-space:nowrap; z-index:3; display:none; }
.tip b { display:block; margin-bottom:2px; }
.tip i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
.legend i { display:inline-block; width:12px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }

.table-wrap { overflow-x:auto; margin:0 -16px; padding:0 16px; }
table { border-collapse:collapse; width:100%; min-width:760px; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
th { font-size:12px; color:var(--muted); font-weight:600; }
tbody tr { cursor:pointer; }
tbody tr:hover td { background:var(--hover); }
td.cab { min-width:150px; }
.pnow { font-weight:650; }
.delta { font-size:12px; margin-left:6px; }
.spark { vertical-align:middle; margin-left:8px; }
td.itin { white-space:normal; color:var(--muted); font-size:13px; min-width:180px; }

dialog { border:none; border-radius:14px; padding:0; width:min(920px, calc(100vw - 24px)); max-height:calc(100vh - 24px); background:var(--card); color:var(--fg); box-shadow:0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background:rgba(0,0,0,.45); }
.dlg-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:16px 18px 0; }
.dlg-head h2 { font-size:18px; }
.dlg-body { padding:12px 18px 18px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; margin:6px 0 14px; }
.stat { border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.stat h3 { margin:0 0 4px; font-size:13px; display:flex; align-items:center; gap:6px; }
.stat h3 i { width:9px; height:9px; border-radius:50%; display:inline-block; }
.stat .big { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
.stat dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:6px 0 0; font-size:12px; color:var(--muted); }
.stat dd { margin:0; text-align:right; color:var(--fg); font-variant-numeric:tabular-nums; }
.log { width:100%; min-width:0; font-size:13px; }
.log td, .log th { padding:6px 6px; }
.log tbody tr { cursor:default; } .log tbody tr:hover td { background:none; }

.editor-row { display:grid; grid-template-columns: minmax(180px, 1.4fr) repeat(3, minmax(110px, 1fr)) auto; gap:8px; align-items:end; padding:10px 0; border-bottom:1px solid var(--line); }
.editor-row label, .thr label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
.editor-row .cabins { grid-column:1 / -1; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); }
.editor-row .cabins label.cabin-toggle { flex-direction:row; color:var(--fg); }
.thr { display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; }
.steps { font-size:13px; color:var(--muted); padding-left:18px; }
pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; overflow:auto; max-height:200px; }
.err { color:var(--up); font-size:13px; }
.empty { color:var(--muted); font-size:14px; padding:8px 0; }

@media (max-width: 640px) {
  .change { grid-template-columns:84px 1fr; }
  .change .prices { grid-column:2; }
  .change svg { display:none; }
  .editor-row { grid-template-columns:1fr 1fr; }
  .editor-row > label:first-child { grid-column:1 / -1; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>CruiseWatch</h1>
      <p id="status" class="muted"></p>
      <div class="chips" id="tracking"></div>
    </div>
    <button id="edit-btn">Change what's tracked</button>
  </header>

  <div class="filters" id="filters"></div>

  <section class="card">
    <div class="card-head">
      <h2>What changed</h2>
      <div class="seg" id="window"></div>
    </div>
    <p class="summary" id="changes-summary"></p>
    <ul class="changes" id="changes"></ul>
    <button class="link" id="changes-more" hidden></button>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Price now, by sail date</h2>
      <div class="legend" id="overview-legend"></div>
    </div>
    <div class="chart" id="overview"></div>
    <p class="faint" style="font-size:12px;margin:6px 0 0">Lowest price per person for 2 guests, taxes included. Hover to compare, click a sailing for its history.</p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>All sailings <span class="muted" id="count" style="font-weight:400"></span></h2>
      <label class="muted" style="font-size:13px">Sort
        <select id="sort">
          <option value="date">Sail date</option>
          <option value="drop">Biggest drop since first seen</option>
          <option value="price">Lowest price now</option>
        </select>
      </label>
    </div>
    <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>
</main>

<dialog id="detail"></dialog>
<dialog id="editor"></dialog>

        const st = s.st[c]; const d = st.now != null && st.first != null ? st.now - st.first : 0;
        return el("div", { class: "stat" },
          el("h3", {}, el("i", { style: `background:${color(c)}` }), NAMES[c] || c),
          el("div", { class: "big" }, st.now == null ? "sold out" : usd(st.now),
            d ? el("span", { class: `delta ${d < 0 ? "down" : "up"}`, textContent: `${signed(d)} (${pctOf(d, st.first)})` }) : null),
          el("dl", {},
            el("dt", { textContent: "First seen" }), el("dd", { textContent: st.first == null ? "—" : `${usd(st.first)} · ${F.date.format(T[st.firstR])}` }),
            el("dt", { textContent: "Lowest" }), el("dd", { textContent: st.low == null ? "—" : `${usd(st.low)} · ${F.date.format(T[st.lowR])}` }),
            el("dt", { textContent: "Highest" }), el("dd", { textContent: st.high == null ? "—" : `${usd(st.high)} · ${F.date.format(T[st.highR])}` })));
      })),
      el("h3", { style: "font-size:14px;margin:4px 0 6px", textContent: "Price history" }),
      chartBox,
      el("h3", { style: "font-size:14px;margin:16px 0 6px", textContent: "Price changes" }),
      log.length
        ? el("table", { class: "log" }, el("thead", {}, el("tr", {}, el("th", { textContent: "When" }), el("th", { textContent: "Cabin" }), el("th", { textContent: "Price" }), el("th", { textContent: "Change" }))),
            el("tbody", {}, log.map((x) => {
              const d = x.from != null && x.to != null ? x.to - x.from : null;
              return el("tr", {}, el("td", { textContent: fmtTime(T[x.r]) }), el("td", { textContent: NAMES[x.c] || x.c }),
                el("td", {}, el("s", { class: "faint", textContent: x.from == null ? "sold out" : usd(x.from) }), " → ", el("b", { textContent: x.to == null ? "sold out" : usd(x.to) })),
                el("td", { class: d == null ? "" : d < 0 ? "down" : "up", textContent: d == null ? "" : `${signed(d)} (${pctOf(d, x.from)})` }));
            })))
        : el("p", { class: "empty", textContent: `No price changes since ${T.length ? F.date.format(T[0]) : "tracking began"}.` })));
  dlg.onclose = () => { if (location.hash) history.replaceState(null, "", location.pathname + location.search); };
  if (!dlg.open) dlg.showModal();
  history.replaceState(null, "", "#s=" + encodeURIComponent(id));
  const runXs = T.slice();
  charts.splice(0, charts.length, ...charts.filter((c) => c.box.isConnected));
  lineChart(chartBox, {
    height: 240, step: true, dot: 3, extendTo: T[LAST], xMin: T[0], xMax: T[LAST],
    series: cabs.map((c) => ({ key: c, color: color(c), pts: s.cabins[c].map(([r, p]) => [T[r], p]) })),
    xs: runXs,
    xFmt: (v) => F.date.format(v),
    valueAt: (ser, x) => { const r = T.indexOf(x); return priceAt(s.cabins[ser.key], r) ?? null; },
    tip: (x) => {
      const r = T.indexOf(x);
      return el("div", {}, el("b", { textContent: fmtTime(x) }),
        cabs.map((c) => el("div", {}, el("i", { style: `background:${color(c)}` }), `${NAMES[c]}: ${usd(priceAt(s.cabins[c], r))}`)));
    },
  });
}

// ---------- tracking editor ----------
function openEditor() {
  const dlg = $("editor");
  const rows = D.watchlist.ships.map((w) => ({ code: w.code, from: w.from || "", to: w.to || "", minNights: w.minNights || "", cabins: new Set(w.cabins || []) }));
  const thr = { minDropPct: D.watchlist.alerts?.minDropPct ?? 5, minDropUsd: D.watchlist.alerts?.minDropUsd ?? 50 };
  const list = el("div", {}), pre = el("pre", {}), err = el("p", { class: "err" });
  const build = () => {
    const ships = rows.map((r) => {
      const o = { code: r.code, name: FLEET.get(r.code) || r.code };
      if (r.from) o.from = r.from;
      if (r.to) o.to = r.to;
      if (r.minNights) o.minNights = +r.minNights;
      if (r.cabins.size) o.cabins = ORDER.filter((c) => r.cabins.has(c));
      return o;
    });
    return { alerts: { minDropPct: +thr.minDropPct, minDropUsd: +thr.minDropUsd }, ships };
  };
  const problems = () => {
    const p = [];
    if (!rows.length) p.push("Add at least one ship.");
    const codes = rows.map((r) => r.code);
    if (new Set(codes).size !== codes.length) p.push("Each ship can appear only once.");
    for (const r of rows) if (r.from && r.to && r.from > r.to) p.push(`${FLEET.get(r.code)}: the start date is after the end date.`);
    if (!(+thr.minDropPct >= 0) || !(+thr.minDropUsd >= 0)) p.push("Thresholds must be zero or more.");
    return p;
  };
  const refresh = () => {
    const json = JSON.stringify(build(), null, 2) + "\n";
    pre.textContent = json;
    err.textContent = problems().join(" ");
    return json;
  };
  const renderRows = () => {
    list.replaceChildren(...rows.map((r, i) => {
      const input = (key, type, extra = {}) => el("input", Object.assign({ type, value: r[key], oninput: (e) => { r[key] = e.target.value; refresh(); } }, extra));
      return el("div", { class: "editor-row" },
        el("label", {}, "Ship", el("select", { onchange: (e) => { r.code = e.target.value; refresh(); } },
          D.fleet.map((f) => el("option", { value: f.code, textContent: f.name, selected: f.code === r.code })))),
        el("label", {}, "Sailing from (optional)", input("from", "date")),
        el("label", {}, "Sailing to (optional)", input("to", "date")),
        el("label", {}, "Min nights", input("minNights", "number", { min: 1, max: 30, placeholder: "any" })),
        el("button", { textContent: "Remove", onclick: () => { rows.splice(i, 1); renderRows(); } }),
        el("div", { class: "cabins" }, "Cabins:", ORDER.map((c) => {
          const lab = el("label", { class: "cabin-toggle" + (r.cabins.has(c) ? " on" : "") },
            el("input", { type: "checkbox", checked: r.cabins.has(c), onchange: () => {
              r.cabins.has(c) ? r.cabins.delete(c) : r.cabins.add(c); lab.classList.toggle("on"); refresh(); } }),
            el("i", { style: `background:${color(c)}` }), NAMES[c]);
          return lab;
        }), el("span", { class: "faint", textContent: "(none ticked = all cabins)" })));
    }));
    refresh();
  };
  const thrInput = (key, label) => el("label", {}, label, el("input", { type: "number", min: 0, value: thr[key], style: "width:110px", oninput: (e) => { thr[key] = e.target.value; refresh(); } }));
  const saveBtn = el("button", { class: "primary", textContent: "Copy and open GitHub to save", onclick: async () => {
    if (problems().length) return;
    const json = refresh();
    let copied = false;
    try { await navigator.clipboard.writeText(json); copied = true; } catch {}
    saveBtn.textContent = copied ? "Copied — paste it in GitHub" : "Copy the text below, then paste it in GitHub";
    window.open(D.editUrl, "_blank", "noopener");
  } });
  dlg.replaceChildren(
    el("div", { class: "dlg-head" }, el("h2", { textContent: "Change what's tracked" }), el("button", { textContent: "Close", onclick: () => dlg.close() })),
    el("div", { class: "dlg-body" },
      el("p", { class: "muted", style: "margin:0;font-size:13px", textContent: "Pick ships, sail dates, trip length and cabin types. Prices are checked for every sailing that matches." }),
      list,
      el("button", { style: "margin-top:10px", textContent: "+ Add a ship", onclick: () => {
        const used = new Set(rows.map((r) => r.code));
        rows.push({ code: (D.fleet.find((f) => !used.has(f.code)) || D.fleet[0]).code, from: "", to: "", minNights: "", cabins: new Set() });
        renderRows(); } }),
      el("h3", { style: "font-size:14px;margin:18px 0 0", textContent: "Email me when a price drops at least" }),
      el("div", { class: "thr" }, thrInput("minDropPct", "Percent (%)"), thrInput("minDropUsd", "and dollars per person ($)")),
      err,
      el("ol", { class: "steps" },
        el("li", { textContent: "Click the button: the new watchlist is copied and GitHub's editor for it opens (you need to be signed in as the repo owner)." }),
        el("li", { textContent: "In GitHub, select all the text, paste, and click “Commit changes”." }),
        el("li", { textContent: "The next price check (8 AM or 8 PM New York time) uses it. New ships appear here after that check." })),
      saveBtn,
      el("details", { style: "margin-top:12px" }, el("summary", { class: "muted", style: "font-size:13px;cursor:pointer", textContent: "Show the watchlist text" }), pre)));
  renderRows();
  dlg.showModal();
}
$("edit-btn").onclick = openEditor;

// ---------- boot ----------
$("sort").value = state.sort;
$("sort").onchange = (e) => { state.sort = e.target.value; store.set("sort", state.sort); renderTable(); };
function renderAll() { renderChanges(); renderOverview(); renderTable(); }
renderHeader();
renderFilters();
renderAll();
const m = location.hash.match(/^#s=(.+)$/);
if (m) openDetail(decodeURIComponent(m[1]));
</script>
</body>
