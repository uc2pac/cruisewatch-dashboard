<style>
:root { --bg:#fbfbfa; --fg:#1d1d1b; --muted:#6b6b66; --line:#e4e3df; --card:#fff; --down:#1a7f4b; --up:#b4232c; --s1:#2f6fd6; --s2:#d9822b; --s3:#7a52c7; --s4:#1f9e8f; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe7; --muted:#9a9a93; --line:#2e2e2b; --card:#1d1d1b; --down:#4cc38a; --up:#f0717a; --s1:#6ea0f0; --s2:#f0a85c; --s3:#a98ae6; --s4:#4fc7b8; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:22px; margin:0 0 4px; }
.sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
h2 { font-size:15px; margin:28px 0 8px; }
.alerts { display:grid; gap:6px; margin:0; padding:0; list-style:none; }
.alerts li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; }
.wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--card); }
table { border-collapse:collapse; width:100%; min-width:720px; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; user-select:none; position:sticky; top:0; background:var(--card); }
th[data-sort]:hover { color:var(--fg); }
tr.row { cursor:pointer; }
tr.row:hover td { background:color-mix(in srgb, var(--fg) 4%, transparent); }
td.num { text-align:right; }
.price { font-weight:600; }
.delta { font-size:12px; margin-left:4px; }
.down { color:var(--down); } .up { color:var(--up); } .muted { color:var(--muted); }
.low { font-size:11px; color:var(--down); border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:4px; }
td.name { white-space:normal; min-width:200px; color:var(--muted); font-size:13px; }
tr.chart td { background:var(--bg); padding:12px 10px 16px; }
.legend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-bottom:6px; flex-wrap:wrap; }
.legend i { display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
svg text { fill:var(--muted); font-size:11px; }
a { color:var(--s1); }
.controls { display:flex; gap:10px; align-items:center; margin:0 0 8px; font-size:13px; color:var(--muted); flex-wrap:wrap; }
select { font:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; }
</style>
</head>

.613Z","id":"IC07W790_2027-05-01","cabin":"BALCONY","from":2391.26,"to":2191.76,"issue":4},{"at":"2026-11-24T04:23:17.613Z","id":"IC07W698_2026-11-28","cabin":"BALCONY","from":1474.89,"to":1204.89,"issue":4},{"at":"2026-11-24T04:23:17.613Z","id":"IC07E549_2027-05-08","cabin":"BALCONY","from":2713.37,"to":2150.87,"issue":4}],"cabinOrder":["INTERIOR","OUTSIDE","BALCONY","DELUXE"]}</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const NAMES = { INTERIOR: "Interior", OUTSIDE: "Ocean view", BALCONY: "Balcony", DELUXE: "Suite" };
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
const cabins = D.cabinOrder.filter((c) => D.sailings.some((s) => s.cabins[c]));
const usd = (n) => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
const fmtDate = (iso) => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
const byId = new Map(D.sailings.map((s) => [s.id, s]));

function stats(series) {
  const prices = series.map((p) => p[1]).filter((p) => p != null);
  const now = series[series.length - 1][1];
  return { now, first: prices[0], low: prices.length ? Math.min(...prices) : null, changed: series.length > 1 };
}

document.getElementById("sub").textContent =
  D.sailings.length + " sailings · " + D.runs.length + " price checks since " + (D.runs[0] ? fmtDate(D.runs[0]) : "—") +
  " · updated " + fmtDate(D.generatedAt);

if (D.alerts.length) {
  document.getElementById("alerts-wrap").hidden = false;
  const ul = document.getElementById("alerts");
  for (const a of D.alerts) {
    const s = byId.get(a.id);
    ul.append(el("li", {}, fmtDate(a.at) + " · " + (s ? s.date + " " + s.nights + "n " + s.port : a.id) + " · " + (NAMES[a.cabin] || a.cabin) + " ",
      el("span", { className: "muted", textContent: usd(a.from) + " → " }), el("b", { className: "down", textContent: usd(a.to) })));
  }
}

const head = document.getElementById("head");
head.append(el("tr", {}, el("th", { textContent: "Sail date" }), el("th", { textContent: "Nights" }), el("th", { textContent: "From" }),
  ...cabins.map((c) => el("th", { className: "num", textContent: NAMES[c] || c })), el("th", { textContent: "Itinerary" }), el("th", { textContent: "" })));

function cell(series) {
  if (!series) return el("td", { className: "num muted", textContent: "—" });
  const st = stats(series);
  const td = el("td", { className: "num" }, el("span", { className: "price", textContent: usd(st.now) }));
  if (st.now != null && st.first != null && st.now !== st.first) {
    const d = st.now - st.first;
    td.append(el("span", { className: "delta " + (d < 0 ? "down" : "up"), textContent: (d < 0 ? "−" : "+") + usd(Math.abs(d)) }));
  }
  if (st.changed && st.now != null && st.now === st.low && st.now < st.first) td.append(el("span", { className: "low", textContent: "low" }));
  return td;
}

function chart(s) {
  const W = 900, H = 200, L = 56, R = 12, T = 10, B = 24;
  const n = Math.max(D.runs.length - 1, 1);
  const series = cabins.filter((c) => s.cabins[c]).map((c, i) => ({ c, color: COLORS[cabins.indexOf(c) % 4], pts: s.cabins[c] }));
  const vals = series.flatMap((x) => x.pts.map((p) => p[1])).filter((v) => v != null);
  if (!vals.length) return el("div", { className: "muted", textContent: "No prices yet." });
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 20) { lo -= 10; hi += 10; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = (r) => L + (r / n) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("width", "100%"); svg.setAttribute("role", "img");
  const add = (tag, attrs, text) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; svg.append(e); return e; };
  for (let i = 0; i <= 3; i++) {
    const v = lo + ((hi - lo) * i) / 3;
    add("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--line)" });
    add("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, usd(v));
  }
  add("text", { x: L, y: H - 6 }, D.runs[0] ? fmtDate(D.runs[0]) : "");
  add("text", { x: W - R, y: H - 6, "text-anchor": "end" }, fmtDate(D.runs[D.runs.length - 1]));
  for (const sr of series) {
    // Step line: a price holds until the next change; extend to the latest run.
    let d = "", prev = null;
    const pts = [...sr.pts, [D.runs.length - 1, sr.pts[sr.pts.length - 1][1]]];
    for (const [r, v] of pts) {
      if (v == null) { prev = null; continue; }
      if (prev == null) d += "M" + x(r) + " " + y(v);
      else d += "H" + x(r) + "V" + y(v);
      prev = v;
    }
    add("path", { d, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round" });
    for (const [r, v] of sr.pts) if (v != null) add("circle", { cx: x(r), cy: y(v), r: 2.5, fill: sr.color }).append(Object.assign(document.createElementNS(ns, "title"), { textContent: (NAMES[sr.c] || sr.c) + " " + usd(v) + " · " + fmtDate(D.runs[r]) }));
  }
  const legend = el("div", { className: "legend" }, ...series.map((sr) => {
    const st = stats(sr.pts);
    return el("span", {}, el("i", { style: "background:" + sr.color }), (NAMES[sr.c] || sr.c) + ": now " + usd(st.now) + ", first " + usd(st.first) + ", low " + usd(st.low));
  }));
  return el("div", {}, legend, svg);
}

function sortKey(s, mode) {
  const st = cabins.map((c) => s.cabins[c] && stats(s.cabins[c])).filter(Boolean);
  if (mode === "price") return Math.min(...st.map((x) => x.now ?? Infinity));
  if (mode === "drop") return Math.min(...st.map((x) => (x.now != null && x.first ? (x.now - x.first) / x.first : 0)));
  return s.date;
}

function render() {
  const mode = document.getElementById("sort").value;
  const list = [...D.sailings].sort((a, b) => { const ka = sortKey(a, mode), kb = sortKey(b, mode); return ka < kb ? -1 : ka > kb ? 1 : a.date.localeCompare(b.date); });
  const body = document.getElementById("body");
  body.replaceChildren();
  for (const s of list) {
    const tr = el("tr", { className: "row" }, el("td", { textContent: s.date }), el("td", { textContent: s.nights }), el("td", { textContent: s.port }),
      ...cabins.map((c) => cell(s.cabins[c])), el("td", { className: "name", textContent: s.name }),
      el("td", {}, el("a", { href: s.url, target: "_blank", rel: "noopener", textContent: "book", onclick: (e) => e.stopPropagation() })));
    tr.onclick = () => {
      const next = tr.nextElementSibling;
      if (next && next.classList.contains("chart")) { next.remove(); return; }
      tr.after(el("tr", { className: "chart" }, el("td", { colSpan: 5 + cabins.length }, chart(s))));
    };
    body.append(tr);
  }
}
document.getElementById("sort").onchange = render;
render();
</script>
